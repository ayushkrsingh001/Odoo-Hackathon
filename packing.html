<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Packing Checklist — Traveloop</title>
  <meta name="description" content="Smart packing list for your trip. Never forget an essential item again.">
  <meta name="theme-color" content="#004ac6">
  <link rel="icon" type="image/svg+xml" href="assets/logo/traveloop-icon.svg">
  <link rel="stylesheet" href="src/styles/main.css">
</head>
<body class="page-with-sidebar">

  <script src="src/scripts/navigation.js"></script>
  <script>renderSidebar('packing'); renderTopNav('Traveloop'); renderBottomNav('dashboard');</script>

  <main class="page-main page-main-full">
    <!-- Trip Selector Section -->
    <section id="trip-selector-section" style="padding-top: 8px;"></section>

    <!-- Feature Workspace (Hidden by default) -->
    <section id="feature-workspace" style="display: none;">
      <!-- Page Header -->
      <div class="flex-responsive reveal" style="justify-content:space-between;align-items:flex-end;margin-bottom:32px;">
        <div>
          <h2 class="text-headline-lg" id="selected-trip-name" style="font-weight:800; color:var(--color-primary); margin-bottom:4px;">Packing Checklist</h2>
          <p class="text-body-md" id="selected-trip-dates" style="color:var(--color-on-surface-variant);">Don't forget anything!</p>
        </div>
        <div style="display:flex;gap:8px;">
          <button id="add-item-btn" class="btn btn-primary">
            <span class="material-symbols-outlined" style="font-size:18px;">add</span>
            Add Item
          </button>
        </div>
      </div>

      <!-- Global Progress -->
      <div id="packing-progress-card" class="card card-bordered reveal" style="margin-bottom:32px; display:none;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <div>
            <h3 class="text-headline-md" style="font-weight:700;">Overall Progress</h3>
            <p class="text-body-sm" id="progress-count-text" style="color:var(--color-on-surface-variant);margin-top:4px;">0 of 0 items packed</p>
          </div>
          <span class="text-headline-lg" id="progress-percent-text" style="font-weight:700;color:var(--color-primary);">0%</span>
        </div>
        <div class="progress-track" style="height:8px;">
          <div id="packing-progress-fill" class="progress-fill progress-fill-primary" style="width:0%;"></div>
        </div>
      </div>

      <!-- Checklist Categories -->
      <div id="packing-categories-grid" class="grid-2 stagger-children">
         <!-- Skeletons -->
         <div class="skeleton" style="height:300px;"></div>
         <div class="skeleton" style="height:300px;"></div>
      </div>
    </section>
  </main>

  <!-- Packing Modal -->
  <div id="packing-modal" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); z-index:1000; align-items:center; justify-content:center;">
    <div class="card card-bordered reveal" style="width:100%; max-width:400px; padding:32px; background:var(--color-surface-container-lowest);">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h3 class="text-headline-md" style="font-weight:700;">Add Item</h3>
        <button id="close-packing-modal" class="btn-icon" style="background:none; border:none; cursor:pointer;">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      
      <form id="packing-form" style="display:flex; flex-direction:column; gap:20px;">
        <div style="display:flex; flex-direction:column; gap:8px;">
          <label class="text-label-sm" for="pack-name">Item Name</label>
          <input type="text" id="pack-name" class="input-field" placeholder="e.g. Passport" required>
        </div>
        
        <div style="display:flex; flex-direction:column; gap:8px;">
          <label class="text-label-sm" for="pack-category">Category</label>
          <select id="pack-category" class="input-field" style="appearance:none; background:var(--color-surface-container-low);">
            <option value="Clothing">Clothing</option>
            <option value="Electronics">Electronics</option>
            <option value="Toiletries">Toiletries</option>
            <option value="Documents">Documents</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top:12px; width:100%;">
          Add Item
        </button>
      </form>
    </div>
  </div>

  <script src="src/scripts/app.js"></script>
  <script type="module" src="src/js/pages/packing.js"></script>
</body>
</html>
