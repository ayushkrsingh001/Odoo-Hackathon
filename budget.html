<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Planner — Traveloop</title>
  <meta name="description" content="Track your trip expenses, manage your budget, and keep spending under control with visual analytics.">
  <meta name="theme-color" content="#004ac6">
  <link rel="icon" type="image/svg+xml" href="assets/logo/traveloop-icon.svg">
  <link rel="stylesheet" href="src/styles/main.css">
</head>
<body class="page-with-sidebar">

  <script src="src/scripts/navigation.js"></script>
  <script>renderSidebar('budget'); renderTopNav('Traveloop'); renderBottomNav('budget');</script>

  <main class="page-main page-main-full">
    <!-- Trip Selector Section -->
    <section id="trip-selector-section" style="padding-top: 8px;"></section>

    <!-- Feature Workspace (Hidden by default) -->
    <section id="feature-workspace" style="display: none;">
      <!-- Page Header -->
      <div class="flex-responsive reveal" style="justify-content:space-between;align-items:flex-end;margin-bottom:32px;">
        <div>
          <h2 class="text-headline-lg" id="selected-trip-name" style="font-weight:800; color:var(--color-primary); margin-bottom:4px;">Trip Budget</h2>
          <p class="text-body-md" id="selected-trip-dates" style="color:var(--color-on-surface-variant);">Planning your expenses</p>
        </div>
        <div style="display:flex;gap:8px;">
          <button id="add-expense-btn" class="btn btn-primary">
            <span class="material-symbols-outlined" style="font-size:18px;">add</span>
            Update Budget
          </button>
        </div>
      </div>

      <!-- KPI Cards -->
      <div class="grid-4 stagger-children" style="margin-bottom:32px;">
        <div class="card card-bordered" style="padding:20px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
            <span class="text-label-sm" style="color:var(--color-on-surface-variant);">Total Budget</span>
            <span class="material-symbols-outlined" style="color:var(--color-primary);font-size:20px;">account_balance_wallet</span>
          </div>
          <span id="total-budget-val" style="font-size:28px;font-weight:700;line-height:1;">$0</span>
        </div>
        <div class="card card-bordered" style="padding:20px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
            <span class="text-label-sm" style="color:var(--color-on-surface-variant);">Cost Per Day</span>
            <span class="material-symbols-outlined" style="color:var(--color-secondary);font-size:20px;">calendar_today</span>
          </div>
          <span id="cost-per-day-val" style="font-size:28px;font-weight:700;line-height:1;color:var(--color-secondary);">$0</span>
        </div>
        <div class="card card-bordered" style="padding:20px; display:flex; flex-direction:column; justify-content:center;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
            <span class="text-label-sm" style="color:var(--color-on-surface-variant);">Currency Converter</span>
            <span class="material-symbols-outlined" style="color:var(--color-tertiary);font-size:20px;">currency_exchange</span>
          </div>
          <div style="display:flex; gap:8px;">
              <select id="currency-select" class="input-field" style="padding:4px 8px; height:auto;">
                  <option value="USD">USD ($)</option>
                  <option value="EUR">EUR (€)</option>
                  <option value="GBP">GBP (£)</option>
                  <option value="INR">INR (₹)</option>
                  <option value="JPY">JPY (¥)</option>
              </select>
              <span id="converted-budget-val" style="font-size:20px;font-weight:700;line-height:1.2; align-self:center;">$0</span>
          </div>
        </div>
      </div>

      <div class="grid-2" style="margin-bottom:32px;">
          <!-- Budget Form -->
          <div class="card card-bordered reveal" style="padding:24px;">
              <h3 class="text-headline-md" style="margin-bottom:20px; font-weight:700;">Budget Categories</h3>
              <form id="budget-form" style="display:flex; flex-direction:column; gap:16px;">
                  <div style="display:flex; align-items:center; gap:12px;">
                      <span class="material-symbols-outlined" style="color:var(--color-primary);">hotel</span>
                      <div style="flex:1;">
                          <label class="text-label-sm" for="cost-accommodation">Accommodation</label>
                          <input type="number" id="cost-accommodation" class="input-field" value="0" min="0" step="1">
                      </div>
                  </div>
                  <div style="display:flex; align-items:center; gap:12px;">
                      <span class="material-symbols-outlined" style="color:var(--color-primary);">directions_bus</span>
                      <div style="flex:1;">
                          <label class="text-label-sm" for="cost-transportation">Transportation</label>
                          <input type="number" id="cost-transportation" class="input-field" value="0" min="0" step="1">
                      </div>
                  </div>
                  <div style="display:flex; align-items:center; gap:12px;">
                      <span class="material-symbols-outlined" style="color:var(--color-primary);">restaurant</span>
                      <div style="flex:1;">
                          <label class="text-label-sm" for="cost-meals">Meals</label>
                          <input type="number" id="cost-meals" class="input-field" value="0" min="0" step="1">
                      </div>
                  </div>
                  <div style="display:flex; align-items:center; gap:12px;">
                      <span class="material-symbols-outlined" style="color:var(--color-primary);">explore</span>
                      <div style="flex:1;">
                          <label class="text-label-sm" for="cost-activities">Activities</label>
                          <input type="number" id="cost-activities" class="input-field" value="0" min="0" step="1">
                      </div>
                  </div>
                  <div style="display:flex; align-items:center; gap:12px;">
                      <span class="material-symbols-outlined" style="color:var(--color-primary);">shopping_bag</span>
                      <div style="flex:1;">
                          <label class="text-label-sm" for="cost-shopping">Shopping</label>
                          <input type="number" id="cost-shopping" class="input-field" value="0" min="0" step="1">
                      </div>
                  </div>
                  <div style="display:flex; align-items:center; gap:12px;">
                      <span class="material-symbols-outlined" style="color:var(--color-primary);">more_horiz</span>
                      <div style="flex:1;">
                          <label class="text-label-sm" for="cost-misc">Miscellaneous</label>
                          <input type="number" id="cost-misc" class="input-field" value="0" min="0" step="1">
                      </div>
                  </div>
                  <button type="submit" class="btn btn-primary" style="margin-top:8px;">Save Budget Changes</button>
              </form>
          </div>

          <!-- Charts / Summary -->
          <div class="card card-bordered reveal" style="padding:24px; display:flex; flex-direction:column; gap:24px;">
              <h3 class="text-headline-md" style="font-weight:700;">Expense Analytics</h3>
              <div id="budget-chart-container" style="flex:1; display:flex; align-items:center; justify-content:center; min-height:240px; background:var(--color-surface-container-lowest); border-radius:16px;">
                  <!-- We could use Chart.js here, but for now showing a visual breakdown -->
                  <div style="text-align:center; color:var(--color-outline);">
                      <span class="material-symbols-outlined" style="font-size:48px; margin-bottom:8px;">bar_chart</span>
                      <p class="text-body-sm">Expense breakdown visualization</p>
                  </div>
              </div>
              <div id="budget-summary-list" style="display:flex; flex-direction:column; gap:12px;">
                  <!-- Dynamic summary -->
              </div>
          </div>
      </div>
    </section>
  </main>

  <script src="src/scripts/app.js"></script>
  <script type="module" src="src/js/pages/budget.js"></script>
</body>
</html>
