<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Notes - Traveloop</title>
  <link rel="stylesheet" href="src/styles/main.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body class="page-with-sidebar">
  <script src="src/scripts/navigation.js"></script>
  <script>
    renderSidebar('notes');
    renderTopNav('My Notes');
    renderBottomNav('notes');
  </script>
  
  <main class="page-main page-main-full">
    <div class="content-container">
      <!-- Trip Selector Section -->
      <section id="trip-selector-section" style="padding-top: 8px;"></section>

      <!-- Feature Workspace (Hidden by default) -->
      <section id="feature-workspace" style="display: none;">
        <div class="flex-responsive reveal" style="justify-content:space-between;align-items:flex-end;margin-bottom:32px;">
          <div>
            <h2 class="text-headline-lg" id="selected-trip-name" style="font-weight:800; color:var(--color-primary); margin-bottom:4px;">Trip Notes</h2>
            <p class="text-body-md" id="selected-trip-dates" style="color:var(--color-on-surface-variant);">Thoughts and reminders</p>
          </div>
          <div style="display:flex;gap:8px;">
            <button id="add-note-btn" class="btn btn-primary">
              <span class="material-symbols-outlined" style="font-size:18px;">add_notes</span>
              New Note
            </button>
          </div>
        </div>

        <div id="notes-grid" class="grid-3">
          <!-- Notes will be rendered here -->
        </div>
      </section>
    </div>
  </main>

  <!-- Note Modal -->
  <div id="note-modal" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); z-index:1000; align-items:center; justify-content:center;">
    <div class="card card-bordered reveal" style="width:100%; max-width:500px; padding:32px; background:var(--color-surface-container-lowest);">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h3 class="text-headline-md" style="font-weight:700;">New Note</h3>
        <button id="close-note-modal" class="btn-icon" style="background:none; border:none; cursor:pointer;">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      
      <form id="note-form" style="display:flex; flex-direction:column; gap:20px;">
        <div style="display:flex; flex-direction:column; gap:8px;">
          <label class="text-label-sm" for="note-title">Title</label>
          <input type="text" id="note-title" class="input-field" placeholder="e.g. Dream Destinations" required>
        </div>
        
        <div style="display:flex; flex-direction:column; gap:8px;">
          <label class="text-label-sm" for="note-content">Content</label>
          <textarea id="note-content" class="input-field" style="min-height:150px; resize:vertical; padding:12px;" placeholder="Write your thoughts here..." required></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top:12px; width:100%;">
          Save Note
        </button>
      </form>
    </div>
  </div>

  <script src="src/scripts/app.js"></script>
  <script type="module" src="src/js/pages/notes.js"></script>
</body>
</html>
