<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Packing — Traveloop</title>
  <meta name="description" content="AI-powered packing assistant. Get personalized packing suggestions based on your trip details.">
  <link rel="stylesheet" href="src/styles/main.css">
  <style>
    .sp-hero{border-radius:24px;padding:40px 48px;background:linear-gradient(135deg,#064e3b,#065f46,#047857);color:#fff;margin-bottom:40px;position:relative;overflow:hidden}
    .sp-hero::before{content:'';position:absolute;top:-40%;right:-15%;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(52,211,153,.2),transparent 70%);pointer-events:none}
    .sp-hero h1{font-size:32px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px;position:relative;z-index:1}
    .sp-hero p{font-size:15px;opacity:.85;max-width:480px;line-height:1.6;position:relative;z-index:1}
    .sp-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);padding:5px 14px;border-radius:999px;font-size:13px;font-weight:600;margin-bottom:14px;position:relative;z-index:1}

    .sp-trip-select{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:32px}
    .sp-trip-card{background:#fff;border-radius:16px;padding:20px;border:2px solid transparent;cursor:pointer;transition:all .2s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
    .sp-trip-card:hover,.sp-trip-card.selected{border-color:#059669;background:#f0fdf4}
    .sp-trip-card h3{font-size:15px;font-weight:700;color:#0f172a;margin-bottom:4px}
    .sp-trip-card p{font-size:13px;color:#64748b}

    .sp-gen-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 32px;border-radius:14px;border:none;background:linear-gradient(135deg,#059669,#10b981);color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(5,150,105,.3);transition:all .3s;margin-bottom:32px}
    .sp-gen-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(5,150,105,.4)}
    .sp-gen-btn:disabled{opacity:.7;cursor:not-allowed;transform:none}

    .sp-progress{background:#fff;border-radius:20px;padding:24px;margin-bottom:32px;border:1px solid rgba(0,0,0,.06);display:flex;align-items:center;gap:24px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
    .sp-progress-ring{width:80px;height:80px;position:relative;flex-shrink:0}
    .sp-progress-ring svg{transform:rotate(-90deg)}
    .sp-progress-ring .bg{fill:none;stroke:#f1f5f9;stroke-width:7}
    .sp-progress-ring .fill{fill:none;stroke:#10b981;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
    .sp-progress-ring .text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#0f172a}

    .sp-categories{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
    .sp-cat-card{background:#fff;border-radius:20px;padding:24px;border:1px solid rgba(0,0,0,.06);box-shadow:0 1px 3px rgba(0,0,0,.04)}
    .sp-cat-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .sp-cat-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
    .sp-cat-header h3{font-size:16px;font-weight:700;color:#0f172a}
    .sp-cat-header span.count{font-size:12px;color:#64748b;margin-left:auto}

    .sp-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f8fafc}
    .sp-item:last-child{border-bottom:none}
    .sp-item input[type=checkbox]{width:18px;height:18px;accent-color:#059669;cursor:pointer}
    .sp-item label{font-size:14px;color:#334155;cursor:pointer;flex:1}
    .sp-item label.packed{text-decoration:line-through;color:#94a3b8}
    .sp-item .remove-btn{background:none;border:none;cursor:pointer;color:#cbd5e1;padding:4px;transition:color .2s}
    .sp-item .remove-btn:hover{color:#ef4444}

    .sp-add-row{display:flex;gap:8px;margin-top:12px}
    .sp-add-row input{flex:1;padding:8px 14px;border-radius:10px;border:1px solid #e2e8f0;font-size:13px;outline:none}
    .sp-add-row input:focus{border-color:#059669}
    .sp-add-row button{padding:8px 14px;border-radius:10px;border:none;background:#059669;color:#fff;font-size:13px;font-weight:600;cursor:pointer}

    .sp-toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:#064e3b;color:#fff;padding:14px 28px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.2);z-index:9999;opacity:0;transition:all .3s}
    .sp-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media(max-width:768px){.sp-hero{padding:28px 24px}.sp-hero h1{font-size:24px}.sp-categories{grid-template-columns:1fr}.sp-progress{flex-direction:column;text-align:center}}
  </style>
</head>
<body class="page-with-sidebar">
  <script src="src/scripts/navigation.js"></script>
  <script>renderSidebar('packing'); renderTopNav('Traveloop'); renderBottomNav('dashboard');</script>
  <main class="page-main page-main-full">
    <!-- Trip Selector Section -->
    <section id="trip-selector-section" style="padding-top: 8px;"></section>

    <!-- Feature Workspace (Hidden by default) -->
    <section id="feature-workspace" style="display: none;">
      <div class="sp-hero reveal">
        <div class="sp-badge">
          <span class="material-symbols-outlined" style="font-size:16px;">auto_awesome</span>
          AI Powered Assistant
        </div>
        <h1 id="selected-trip-name">Smart Packing assistant</h1>
        <p>Get personalized packing suggestions based on your destination's weather, duration, and planned activities.</p>
      </div>

      <div id="gen-container" style="text-align: center;">
        <button id="generate-btn" class="sp-gen-btn">
          <span class="material-symbols-outlined">magic_button</span>
          Generate Smart List
        </button>
      </div>

      <div id="loading-container" style="display:none; text-align:center; padding:40px;">
        <div class="skeleton" style="height:100px; width:100%; border-radius:20px; margin-bottom:20px;"></div>
        <p class="text-body-md" style="color:var(--color-on-surface-variant);">AI is analyzing your trip details...</p>
      </div>

      <div id="result-container" style="display:none;">
        <div class="sp-progress reveal">
          <div class="sp-progress-ring">
            <svg width="80" height="80">
              <circle class="bg" cx="40" cy="40" r="35"></circle>
              <circle id="progress-circle" class="fill" cx="40" cy="40" r="35" stroke-dasharray="219.9" stroke-dashoffset="219.9"></circle>
            </svg>
            <div class="text" id="progress-text">0%</div>
          </div>
          <div>
            <h2 class="text-headline-md" style="font-weight:800;color:#0f172a;margin-bottom:4px;">Packing Progress</h2>
            <p id="progress-stats" class="text-body-sm" style="color:#64748b;">0 of 0 items packed</p>
          </div>
          <button id="reset-btn" class="btn btn-surface btn-sm" style="margin-left:auto;">Reset List</button>
        </div>

        <div id="categories-container" class="sp-categories stagger-children">
          <!-- Categories will be injected here -->
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="sp-toast">List updated successfully!</div>

  <script src="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"></script>
  <script type="module" src="src/js/pages/smartPacking.js"></script>
</body>
</html>
