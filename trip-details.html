<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Itinerary Builder — Traveloop</title>
  <meta name="description" content="Build your perfect itinerary. Manage your daily schedule and explore ideas.">
  <meta name="theme-color" content="#004ac6">
  <link rel="icon" type="image/svg+xml" href="assets/logo/traveloop-icon.svg">
  <link rel="stylesheet" href="src/styles/main.css">
</head>
<body class="page-with-sidebar">

  <script src="src/scripts/navigation.js"></script>
  <script>renderSidebar('itinerary'); renderTopNav('Traveloop'); renderBottomNav('dashboard');</script>

  <main class="page-main page-main-full" style="padding-bottom:16px;">
    <!-- Page Header -->
    <div class="flex-responsive reveal" style="justify-content:space-between;align-items:flex-end;margin-bottom:24px;">
      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
          <a href="my-trips.html" class="text-label-sm" id="back-to-trips" style="color:var(--color-on-surface-variant);display:flex;align-items:center;gap:4px;">
            <span class="material-symbols-outlined" style="font-size:16px;">arrow_back</span>
            Back to Trips
          </a>
        </div>
        <h1 class="text-headline-xl" id="trip-name-display">Itinerary Builder</h1>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-surface">
          <span class="material-symbols-outlined" style="font-size:18px;">share</span>
          Share
        </button>
      </div>
    </div>

    <!-- 3-Column Layout -->
    <div class="itinerary-layout" style="display: grid; grid-template-columns: 1fr 2fr; gap: 24px;">
      <!-- Column 1: Stops Timeline -->
      <div class="itinerary-sidebar card card-bordered" style="display:flex;flex-direction:column;gap:0;">
        <div style="padding:20px;border-bottom:1px solid rgba(193,198,215,0.3);display:flex;justify-content:space-between;align-items:center;">
          <h3 class="text-headline-md" style="font-weight:700;">Trip Stops</h3>
          <button id="add-stop-btn" class="btn btn-primary btn-sm">
             <span class="material-symbols-outlined" style="font-size:18px;">add_location</span> Add Stop
          </button>
        </div>
        <div id="stops-container" style="flex:1;overflow-y:auto;padding:12px; display:flex; flex-direction:column; gap:12px;">
          <!-- Skeletons -->
          <div class="skeleton" style="height:80px; margin-bottom:8px;"></div>
          <div class="skeleton" style="height:80px; margin-bottom:8px;"></div>
        </div>
      </div>

      <!-- Column 2: Main Schedule -->
      <div class="itinerary-main card card-bordered" style="display:flex;flex-direction:column;">
        <div style="padding:20px;border-bottom:1px solid rgba(193,198,215,0.3);display:flex;justify-content:space-between;align-items:center;">
          <div>
            <h3 class="text-headline-md" id="current-stop-title" style="font-weight:700;">Select a stop</h3>
            <p class="text-body-sm" id="current-stop-dates" style="color:var(--color-on-surface-variant);">...</p>
          </div>
          <button id="add-activity-btn" class="btn btn-primary btn-sm" style="display:none;">
             <span class="material-symbols-outlined" style="font-size:18px;">add</span>
             Add Activity
          </button>
        </div>
        <div id="activities-container" style="flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;">
          <!-- Activities injected here -->
          <div style="text-align:center; padding:48px; color:var(--color-outline);">
             Select a stop from the left to view activities.
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Stop Modal -->
  <div id="stop-modal" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); z-index:1000; align-items:center; justify-content:center;">
    <div class="card card-bordered reveal" style="width:100%; max-width:400px; padding:32px; background:var(--color-surface-container-lowest);">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h3 class="text-headline-md" style="font-weight:700;">Add Stop</h3>
        <button id="close-stop-modal" class="btn-icon" style="background:none; border:none; cursor:pointer;">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      
      <form id="stop-form" style="display:flex; flex-direction:column; gap:20px;">
        <input type="hidden" id="stop-id">
        <div style="display:flex; flex-direction:column; gap:8px;">
          <label class="text-label-sm" for="stop-city">City Name</label>
          <input type="text" id="stop-city" class="input-field" placeholder="e.g. Paris" required>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <label class="text-label-sm" for="stop-country">Country</label>
          <input type="text" id="stop-country" class="input-field" placeholder="e.g. France" required>
        </div>
        
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
          <div style="display:flex; flex-direction:column; gap:8px;">
            <label class="text-label-sm" for="stop-start">Start Date</label>
            <input type="date" id="stop-start" class="input-field" required>
          </div>
          <div style="display:flex; flex-direction:column; gap:8px;">
            <label class="text-label-sm" for="stop-end">End Date</label>
            <input type="date" id="stop-end" class="input-field" required>
          </div>
        </div>

        <div style="display:flex; flex-direction:column; gap:8px;">
          <label class="text-label-sm" for="stop-notes">Notes</label>
          <textarea id="stop-notes" class="input-field" placeholder="Any special notes for this stop..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top:12px; width:100%;">
          Save Stop
        </button>
      </form>
    </div>
  </div>

  <!-- Activity Modal -->
  <div id="activity-modal" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); z-index:1000; align-items:center; justify-content:center;">
    <div class="card card-bordered reveal" style="width:100%; max-width:400px; padding:32px; background:var(--color-surface-container-lowest);">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h3 class="text-headline-md" style="font-weight:700;">Add Activity</h3>
        <button id="close-activity-modal" class="btn-icon" style="background:none; border:none; cursor:pointer;">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      
      <form id="activity-form" style="display:flex; flex-direction:column; gap:20px;">
        <input type="hidden" id="activity-id">
        <div style="display:flex; flex-direction:column; gap:8px;">
          <label class="text-label-sm" for="activity-name">Activity Name</label>
          <input type="text" id="activity-name" class="input-field" placeholder="e.g. Visit Eiffel Tower" required>
        </div>
        
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
          <div style="display:flex; flex-direction:column; gap:8px;">
            <label class="text-label-sm" for="activity-time">Time</label>
            <input type="time" id="activity-time" class="input-field" value="10:00" required>
          </div>
          <div style="display:flex; flex-direction:column; gap:8px;">
            <label class="text-label-sm" for="activity-category">Category</label>
            <select id="activity-category" class="input-field" style="appearance:none; background:var(--color-surface-container-low);">
              <option value="Sightseeing">Sightseeing</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Accommodation">Accommodation</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div style="display:flex; flex-direction:column; gap:8px;">
          <label class="text-label-sm" for="activity-cost">Estimated Cost</label>
          <input type="number" id="activity-cost" class="input-field" placeholder="Amount" value="0">
        </div>
        
        <div style="display:flex; flex-direction:column; gap:8px;">
          <label class="text-label-sm" for="activity-desc">Description</label>
          <textarea id="activity-desc" class="input-field" placeholder="Details about this activity..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top:12px; width:100%;">
          Save Activity
        </button>
      </form>
    </div>
  </div>

  <script src="src/scripts/app.js"></script>
  <script type="module" src="src/js/pages/tripDetails.js"></script>
</body>
</html>
