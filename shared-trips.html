<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Trips — Traveloop</title>
  <meta name="description" content="Discover curated travel itineraries from India and around the world. Copy stunning trip plans into your own Traveloop account.">
  <meta name="theme-color" content="#004ac6">
  <link rel="icon" type="image/svg+xml" href="assets/logo/traveloop-icon.svg">
  <link rel="stylesheet" href="src/styles/main.css">
  <style>
    /* ── Shared Trips Premium Styles ── */

    /* Hero Banner */
    .st-hero {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 40px;
      height: 320px;
      display: flex;
      align-items: flex-end;
    }
    .st-hero-bg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      filter: brightness(0.55);
    }
    .st-hero-content {
      position: relative; z-index: 2;
      padding: 40px 48px;
      color: #fff;
      width: 100%;
    }
    .st-hero-content h1 {
      font-size: 40px; font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    .st-hero-content p {
      font-size: 16px; opacity: 0.9;
      margin-bottom: 24px;
      max-width: 500px;
    }

    /* Search */
    .st-search-bar {
      display: flex; gap: 12px;
      max-width: 560px;
    }
    .st-search-input {
      flex: 1;
      padding: 14px 20px 14px 48px;
      border-radius: 16px;
      border: none;
      font-size: 15px;
      background: rgba(255,255,255,0.95);
      color: #0f172a;
      backdrop-filter: blur(8px);
      outline: none;
      transition: box-shadow 0.2s;
    }
    .st-search-input:focus { box-shadow: 0 0 0 3px rgba(37,99,235,0.3); }
    .st-search-icon {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      color: #64748b; font-size: 22px; pointer-events: none;
    }

    /* Filter Chips */
    .st-filters {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-bottom: 32px;
      padding-bottom: 8px;
    }
    .st-chip {
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid #e2e8f0;
      background: #fff;
      font-size: 14px; font-weight: 500;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .st-chip:hover {
      border-color: #2563eb;
      color: #2563eb;
      background: #eff6ff;
    }
    .st-chip.active {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
      box-shadow: 0 4px 12px rgba(37,99,235,0.25);
    }

    /* Sort Bar */
    .st-sort-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px;
    }
    .st-sort-bar span { font-size: 14px; color: #64748b; }
    .st-sort-bar strong { color: #0f172a; }
    .st-sort-select {
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      font-size: 14px;
      color: #0f172a;
      background: #fff;
      cursor: pointer;
      outline: none;
    }

    /* Trip Grid */
    .st-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 24px;
    }

    /* Trip Card */
    .st-card {
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      display: flex; flex-direction: column;
    }
    .st-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }
    .st-card-img-wrap { position: relative; overflow: hidden; }
    .st-card-img {
      width: 100%; height: 200px;
      object-fit: cover; display: block;
      transition: transform 0.5s;
    }
    .st-card:hover .st-card-img { transform: scale(1.05); }
    .st-card-badges {
      position: absolute; top: 12px; left: 12px;
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .st-badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px; font-weight: 600;
      backdrop-filter: blur(8px);
    }
    .st-badge-cat { background: rgba(37,99,235,0.85); color: #fff; }
    .st-badge-season { background: rgba(255,255,255,0.9); color: #475569; }
    .st-card-rating {
      position: absolute; top: 12px; right: 12px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      color: #fbbf24;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px; font-weight: 700;
      display: flex; align-items: center; gap: 4px;
    }

    .st-card-body {
      padding: 20px;
      flex: 1;
      display: flex; flex-direction: column;
    }
    .st-card-body h3 {
      font-size: 18px; font-weight: 700; color: #0f172a;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .st-card-dest {
      font-size: 13px; color: #64748b;
      display: flex; align-items: center; gap: 4px;
      margin-bottom: 10px;
    }
    .st-card-dest .material-symbols-outlined { font-size: 16px; color: #94a3b8; }
    .st-card-desc {
      font-size: 14px; color: #475569;
      line-height: 1.5;
      margin-bottom: 16px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .st-card-meta {
      display: flex; gap: 16px; flex-wrap: wrap;
      font-size: 13px; color: #64748b;
      margin-bottom: 16px;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
    }
    .st-card-meta span {
      display: flex; align-items: center; gap: 4px;
    }
    .st-card-meta .material-symbols-outlined { font-size: 16px; }

    .st-card-actions {
      display: flex; gap: 8px;
    }
    .st-btn-view {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      font-size: 13px; font-weight: 600;
      text-align: center;
      border: 1px solid #e2e8f0;
      background: #fff;
      color: #0f172a;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .st-btn-view:hover { border-color: #2563eb; color: #2563eb; }
    .st-btn-copy {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      font-size: 13px; font-weight: 600;
      text-align: center;
      border: none;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #fff;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 4px;
      box-shadow: 0 4px 12px rgba(37,99,235,0.2);
    }
    .st-btn-copy:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37,99,235,0.3);
    }
    .st-btn-copy .material-symbols-outlined,
    .st-btn-view .material-symbols-outlined { font-size: 16px; }

    /* Copied Counter */
    .st-copied-count {
      font-size: 12px; color: #94a3b8;
      display: flex; align-items: center; gap: 4px;
    }
    .st-copied-count .material-symbols-outlined { font-size: 14px; }

    /* Toast */
    .st-toast {
      position: fixed;
      bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #fff;
      padding: 14px 28px;
      border-radius: 14px;
      font-size: 14px; font-weight: 600;
      box-shadow: 0 12px 32px rgba(0,0,0,0.2);
      z-index: 9999;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      display: flex; align-items: center; gap: 8px;
    }
    .st-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Empty */
    .st-empty {
      text-align: center;
      padding: 64px 24px;
      grid-column: 1/-1;
    }
    .st-empty .material-symbols-outlined {
      font-size: 64px; color: #cbd5e1; margin-bottom: 16px;
    }
    .st-empty h3 { font-size: 20px; font-weight: 700; color: #334155; margin-bottom: 8px; }
    .st-empty p { font-size: 15px; color: #64748b; }

    /* Responsive */
    @media (max-width: 768px) {
      .st-hero { height: 240px; }
      .st-hero-content { padding: 24px; }
      .st-hero-content h1 { font-size: 28px; }
      .st-grid { grid-template-columns: 1fr; }
      .st-filters { overflow-x: auto; flex-wrap: nowrap; }
    }
  </style>
</head>
<body class="page-with-sidebar">

  <script src="src/scripts/navigation.js"></script>
  <script>renderSidebar('shared'); renderTopNav('Traveloop'); renderBottomNav('dashboard');</script>

  <main class="page-main page-main-full">
    <!-- Hero Banner -->
    <div class="st-hero" id="st-hero">
      <img class="st-hero-bg" src="https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&w=1200&q=80" alt="Travel" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&w=1200&q=80';">
      <div class="st-hero-content">
        <h1>Explore Popular Trips ✈️</h1>
        <p>Discover curated itineraries from India and around the world. Copy any trip into your planner instantly.</p>
        <div class="st-search-bar" style="position:relative;">
          <span class="material-symbols-outlined st-search-icon">search</span>
          <input class="st-search-input" id="st-search" type="text" placeholder="Search destinations, countries, trip names...">
        </div>
      </div>
    </div>

    <!-- Filter Chips -->
    <div class="st-filters" id="st-filters">
      <button class="st-chip active" data-filter="all">All Trips</button>
      <button class="st-chip" data-filter="india">🇮🇳 India</button>
      <button class="st-chip" data-filter="international">🌍 International</button>
      <button class="st-chip" data-filter="budget">💰 Budget</button>
      <button class="st-chip" data-filter="luxury">✨ Luxury</button>
      <button class="st-chip" data-filter="adventure">🧗 Adventure</button>
      <button class="st-chip" data-filter="honeymoon">💕 Honeymoon</button>
      <button class="st-chip" data-filter="family">👨‍👩‍👧‍👦 Family</button>
      <button class="st-chip" data-filter="solo">🎒 Solo</button>
    </div>

    <!-- Sort Bar -->
    <div class="st-sort-bar" id="st-sort-bar">
      <span>Showing <strong id="trip-count">0</strong> trips</span>
      <select class="st-sort-select" id="st-sort">
        <option value="popular">Most Popular</option>
        <option value="rating">Highest Rated</option>
        <option value="budget-low">Lowest Budget</option>
        <option value="budget-high">Highest Budget</option>
        <option value="days">Shortest First</option>
      </select>
    </div>

    <!-- Trip Grid -->
    <div class="st-grid" id="st-grid">
      <!-- Cards injected by JS -->
      <div class="skel" style="height:420px; border-radius:20px;"></div>
      <div class="skel" style="height:420px; border-radius:20px;"></div>
      <div class="skel" style="height:420px; border-radius:20px;"></div>
    </div>

    <!-- Toast -->
    <div class="st-toast" id="st-toast">
      <span class="material-symbols-outlined">check_circle</span>
      <span id="st-toast-msg">Trip copied!</span>
    </div>

    <div style="height:40px;"></div>
  </main>

  <script src="src/scripts/app.js"></script>
  <script type="module" src="src/js/pages/sharedTrips.js"></script>
</body>
</html>
